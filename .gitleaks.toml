# gitleaks configuration: every default rule, plus reviewed allowlists for known false positives.
# gitleaks reads this file from the repository root. Each allowlist names one rule, exact paths and the
# exact shape of the allowed value (condition AND), so a real secret anywhere else still fails.
# Never allowlist a whole folder or a whole rule.
title = "portfolio gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "skills.lock.json records the sha256 of every vendored skill file. A hash next to a file name such as secret-patterns.md or tokens.json looks like a key to generic-api-key. Only 64-character hex values in this one file are allowed."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^skills\.lock\.json$''']
regexes = ['''^[0-9a-f]{64}$''']
