<!-- Ahsan Khan — email signature. Built from brand/tokens.json by scripts/build-brand.mjs.
     Install: open brand/dist/email-signature.html in a browser, select all, copy, paste into Gmail → Settings → Signature.
     No <html>/<head> on purpose: signature editors (Gmail, Outlook) strip them and only
     keep the pasted fragment — mso-* hints go inline instead of a conditional-comment block.
     Kept in sync with recruiter-email.html's plain sign-off (name, title, phone · LinkedIn)
     — same reasoning there applies here: no accent bar, no photo, no colored "CTA" links,
     just three plain lines that read as a person, not a campaign tool. -->
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;font-family:[[t.typography.family.email]];color:[[t.component.email.text]];font-size:14px;line-height:1.45;mso-line-height-rule:exactly;">
  <tr><td style="font-weight:bold;">[[p.name]]</td></tr>
  <tr><td>[[p.title]]</td></tr>
  <tr>
    <td>
      <a href="tel:[[p.phoneTel]]" style="color:inherit;">[[p.phone]]</a> &middot; <a href="[[p.links.linkedin]]">[[p.links.linkedin]]</a>
    </td>
  </tr>
</table>
